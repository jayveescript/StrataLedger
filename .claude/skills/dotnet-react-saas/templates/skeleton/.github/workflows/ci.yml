name: CI

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/ci.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Check migrations are up to date
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes -p src/MyApp.Infrastructure -s src/MyApp.Infrastructure
      # Integration tests start Postgres via Testcontainers (Docker is available on GitHub runners).
      - run: dotnet test --no-build -c Release --logger "trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/TestResults

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
